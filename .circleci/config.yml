version: 2.1
parameters:
  run_publish_beta:
    type: boolean
    default: false
jobs:
  verify:
    machine: { image: ubuntu-2204:current }
    working_directory: /home/circleci/repo/sails-hook-redbox-redcap
    steps:
      - checkout
      - run:
          #TODO: Fix angular
          name: Checkout ReDBox Portal
          command: |
            git clone --depth 1 --branch master https://github.com/redbox-mint/redbox-portal.git ../redbox-portal
            printf '%s\n' \
              '**/.git' \
              '**/node_modules' \
              '**/dist' \
              '**/.tmp' \
              '**/coverage' \
              > ../.dockerignore
      - run: { name: Node and dependencies, command: "nvm install && npm install --include=dev && npm --prefix angular install --include=dev" }
      - run: { name: Compile, command: "npm run compile" }
      - run: { name: Unit tests, command: "npm run test:unit" }
      - run: { name: Angular, command: "npm run build:angular && npm run test:angular" }
      - run: { name: Dependency contract, command: "./node_modules/.bin/redbox-dev-tools check" }
      - run: { name: Integration tests, command: "npm run test:integration:mocha" }
      - run: { name: Package, command: "npm pack --dry-run" }
  publish_beta:
    docker: [{ image: cimg/node:24.12 }]
    steps:
      - checkout
      - run: npm install --include=dev && npm --prefix angular install --include=dev
      - run: { name: Build package, command: "npm run prepack" }
      - run: { name: Set beta version, command: "npm version 1.0.0-beta.${CIRCLE_BUILD_NUM} --no-git-tag-version" }
      - run: { name: Authenticate with npm, command: "npm config set //registry.npmjs.org/:_authToken \"$NPM_TOKEN\"" }
      - run: npm publish --access public --tag beta
workflows:
  build:
    unless: << pipeline.parameters.run_publish_beta >>
    jobs:
      - verify
  beta_publish:
    when: << pipeline.parameters.run_publish_beta >>
    jobs:
      - verify
      - publish_beta:
          requires: [verify]
          context: npm-publish
